name = "horizon-rooms"
main = "src/index.js"
compatibility_date = "2025-01-01"

# The Worker answers on these as well as on workers.dev (which some networks
# block). Each domain's DNS zone must be on the Cloudflare account that deploys
# this; wrangler creates the rooms.* records itself.
routes = [
  { pattern = "rooms.bonziworld.lol", custom_domain = true },
  { pattern = "rooms.zebbigcool.qzz.io", custom_domain = true },
]

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "RegistryObject"

[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayObject"

# SQLite-backed Durable Objects are the ones the free plan includes.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RegistryObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RelayObject"]

# Optional TURN server for players behind strict NATs (the relay only does
# STUN otherwise): set TURN_URL here, and TURN_USER / TURN_PASS with
# `npx wrangler secret put`.
# [vars]
# TURN_URL = "turn:turn.example.com:3478"
