<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>z's horizon</title>
<meta name="theme-color" content="#0a0612">
<link rel="stylesheet" href="launcher.css">
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>

<main id="home" class="view home" hidden>
  <h1 class="logo"><span>z's horizon</span></h1>
  <p class="tagline">pick something to launch</p>
  <p class="online" hidden><i></i><b>0</b> online</p>
  <nav class="tiles" aria-label="Launcher options">
    <a class="tile" href="#chat">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>
      <span>chat</span>
    </a>
    <a class="tile" href="#minecraft">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5zm0 2.3L18.7 8 12 11.7 5.3 8 12 4.3zM5 9.7l6 3.3v6.6l-6-3.3V9.7zm14 0v6.6l-6 3.3V13l6-3.3z"/></svg>
      <span>minecraft</span>
    </a>
  </nav>
</main>

<section id="chat" class="view frame-view" hidden>
  <header class="bar">
    <a class="back" href="#">&larr; back</a>
    <h2>chat</h2>
  </header>
  <iframe id="chat-frame" title="chat" allow="clipboard-write; microphone; camera; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
</section>

<section id="minecraft" class="view mc-view" hidden>
  <header class="bar">
    <a class="back" href="#">&larr; back</a>
    <h2>minecraft</h2>
    <span class="online" hidden><i></i><b>0</b> online</span>
    <button id="refresh" class="ghost" type="button">refresh</button>
  </header>
  <div class="mc-body">
    <div class="rooms-head">
      <h3>public rooms</h3>
      <span id="rooms-note" class="note"></span>
    </div>
    <div class="table-wrap">
      <table class="rooms">
        <thead><tr><th>code</th><th>owner</th><th>players</th><th></th></tr></thead>
        <tbody id="rooms-body"></tbody>
      </table>
      <p id="rooms-empty" class="empty" hidden></p>
    </div>
    <label class="opt-in">
      <input id="public-toggle" type="checkbox">
      list the worlds I share as public rooms
    </label>
    <div class="launch-row">
      <a id="launch" class="launch" href="game.html">Launch!</a>
    </div>
  </div>
</section>

<noscript><p class="noscript">z's horizon needs JavaScript. <a href="game.html">Launch the game directly</a>.</p></noscript>
<script type="module" src="launcher.js"></script>
</body>
</html>
