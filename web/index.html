<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>z's horizon</title>
<meta name="theme-color" content="#0a0612">
<link rel="stylesheet" href="launcher.css">
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>

<main id="home" class="view home" hidden>
  <h1 class="logo"><span>z's horizon</span></h1>
  <p class="tagline">pick something to launch</p>
  <p class="online" hidden><i></i><b>0</b> online</p>
  <nav class="tiles" aria-label="Launcher options">
    <a class="tile" href="#chat">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>
      <span>chat</span>
    </a>
    <a class="tile" href="#minecraft">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5zm0 2.3L18.7 8 12 11.7 5.3 8 12 4.3zM5 9.7l6 3.3v6.6l-6-3.3V9.7zm14 0v6.6l-6 3.3V13l6-3.3z"/></svg>
      <span>minecraft</span>
    </a>
    <a class="tile" href="#games">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6h10a5 5 0 0 1 4.9 4l1 5.2A3 3 0 0 1 20 18.6a3 3 0 0 1-2.4-1.2L16.2 15H7.8l-1.4 2.4A3 3 0 0 1 4 18.6a3 3 0 0 1-2.9-3.4l1-5.2A5 5 0 0 1 7 6zm.5 3v1.5H6V12h1.5v1.5H9V12h1.5v-1.5H9V9H7.5zm8.9.2a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.200zm2.200 2.300a1.1 1.1 0 1 0 0 2.200 1.1 1.1 0 0 0 0-2.200z"/></svg>
      <span>games</span>
    </a>
    <a class="tile" href="#apps">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm14 0a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/></svg>
      <span>apps</span>
    </a>
  </nav>
</main>

<section id="chat" class="view frame-view" hidden>
  <header class="bar">
    <a class="back" href="#">&larr; back</a>
    <h2>chat</h2>
  </header>
  <iframe id="chat-frame" title="chat" allow="clipboard-write; microphone; camera; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
</section>

<section id="minecraft" class="view mc-view" hidden>
  <header class="bar">
    <a class="back" href="#">&larr; back</a>
    <h2>minecraft</h2>
    <span class="online" hidden><i></i><b>0</b> online</span>
    <button id="refresh" class="ghost" type="button">refresh</button>
  </header>
  <div class="mc-body">
    <div class="rooms-head">
      <h3>public rooms</h3>
      <span id="rooms-note" class="note"></span>
    </div>
    <div class="table-wrap">
      <table class="rooms">
        <thead><tr><th>code</th><th>owner</th><th>players</th><th></th></tr></thead>
        <tbody id="rooms-body"></tbody>
      </table>
      <p id="rooms-empty" class="empty" hidden></p>
    </div>
    <label class="opt-in">
      <input id="public-toggle" type="checkbox">
      list the worlds I share as public rooms
    </label>
    <div class="launch-row">
      <a id="launch" class="launch" href="game.html">Launch!</a>
    </div>
  </div>
</section>

<section id="browse" class="view mc-view" hidden>
  <header class="bar">
    <a class="back" href="#">&larr; back</a>
    <h2 id="browse-title">games</h2>
    <span class="online" hidden><i></i><b>0</b> online</span>
  </header>
  <div class="mc-body wide">
    <div class="toolbar">
      <input id="search" type="search" placeholder="search" autocomplete="off" aria-label="search">
      <select id="genre" aria-label="genre" hidden></select>
      <span id="browse-note" class="note"></span>
    </div>
    <div class="grid-wrap">
      <div id="grid" class="grid"></div>
      <p id="browse-empty" class="empty" hidden></p>
    </div>
  </div>
</section>

<section id="player" class="view frame-view" hidden>
  <header class="bar">
    <a id="player-back" class="back" href="#games">&larr; back</a>
    <h2 id="player-title"></h2>
    <span class="online" hidden><i></i><b>0</b> online</span>
    <a id="player-tab" class="ghost" target="_blank" rel="noopener">open in new tab</a>
  </header>
  <iframe id="player-frame" title="game" allow="fullscreen; gamepad; autoplay; clipboard-write; microphone"></iframe>
</section>

<noscript><p class="noscript">z's horizon needs JavaScript. <a href="game.html">Launch the game directly</a>.</p></noscript>
<script type="module" src="launcher.js"></script>
</body>
</html>
