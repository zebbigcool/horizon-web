<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>z's horizon</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body > canvas { display: block; width: 100vw !important; height: 100vh !important; outline: none; }
  #status {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #ddd; font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 16px;
    pointer-events: none; white-space: pre-line;
  }
  #status:empty { display: none; }
  #debug {
    position: fixed; left: 0; right: 0; bottom: 0; max-height: 45vh; margin: 0; overflow: auto; z-index: 9;
    padding: 8px 12px; background: rgba(0, 0, 0, .85); color: #ffd23f; font: 12px/1.4 ui-monospace, monospace;
    white-space: pre-wrap; word-break: break-word; user-select: text;
  }
</style>
</head>
<body>
<div id="status">Starting…</div>
<pre id="debug" hidden></pre>
<script>
// Mouse look. Two things, both set in the launcher's Settings:
//  - Raw mouse input (on by default): the pointer lock asks for unadjusted
//    movement, the browser's own game mode, without the operating system's
//    acceleration and smoothing, which can make the camera jump while moving.
//    A browser that can't do it falls back to the usual lock.
//  - Spike filter: a single event that moves further than a hand could (the
//    browser sometimes reports a huge or reversed one while the pointer is
//    locked) is dropped before the game sees it.
(() => {
  const get = (key) => { try { return localStorage.getItem(key); } catch { return null; } };
  const LIMITS = { off: Infinity, normal: 500, strict: 150 };
  const limit = LIMITS[get("horizon-spike")] ?? LIMITS.normal;
  if (get("horizon-raw-mouse") !== "0") {
    const lock = Element.prototype.requestPointerLock;
    Element.prototype.requestPointerLock = function (options) {
      try {
        const result = lock.call(this, { ...options, unadjustedMovement: true });
        if (result && result.catch) return result.catch(() => lock.call(this, options));
        return result;
      } catch {
        return lock.call(this, options);
      }
    };
  }
  if (limit < Infinity) {
    const spike = (e) => document.pointerLockElement && (Math.abs(e.movementX) > limit || Math.abs(e.movementY) > limit);
    for (const type of ["pointermove", "mousemove"]) {
      addEventListener(type, (e) => { if (spike(e)) e.stopImmediatePropagation(); }, true);
    }
  }
})();
</script>
<script>
// For devices where DevTools isn't available (school Chromebooks): keeps the
// game's console output and shows it on screen only if the game panics. "?debug" in the address, or
// Settings, Show the game's log, shows it always.
(() => {
  const lines = [];
  const box = document.getElementById("debug");
  let shown = new URLSearchParams(location.search).has("debug") || (() => { try { return localStorage.getItem("horizon-debug") === "1"; } catch { return false; } })();
  const text = (a) => { try { return a instanceof Error ? (a.stack || a.message) : typeof a === "string" ? a : JSON.stringify(a); } catch { return String(a); } };
  const render = () => {
    box.hidden = !shown;
    if (shown) {
      box.textContent = lines.slice(-40).join("\n");
      box.scrollTop = box.scrollHeight;
    }
  };
  const add = (kind, args) => {
    const line = `${kind}: ${args.map(text).join(" ")}`.slice(0, 2500);
    lines.push(line);
    if (lines.length > 200) lines.shift();
    if (/panicked/i.test(line)) shown = true; // the game died: show why
    render();
  };
  for (const kind of ["log", "info", "warn", "error"]) {
    const original = console[kind].bind(console);
    console[kind] = (...args) => { original(...args); add(kind, args); };
  }
  addEventListener("error", (e) => add("error", [e.error ?? e.message]));
  addEventListener("unhandledrejection", (e) => add("error", ["unhandled", e.reason]));
  (async () => {
    const info = [`isolated: ${self.crossOriginIsolated}`, `cores: ${navigator.hardwareConcurrency}`, `memory: ${navigator.deviceMemory ?? "?"} GB`];
    try {
      const adapter = navigator.gpu && (await navigator.gpu.requestAdapter());
      info.push(adapter ? `gpu: ${[adapter.info?.vendor, adapter.info?.architecture, adapter.info?.description].filter(Boolean).join(" ") || "adapter found"}` : "gpu: no WebGPU adapter");
    } catch (e) { info.push(`gpu: ${e}`); }
    lines.unshift(...info);
    render();
  })();
})();
</script>
<script type="module" src="main.js"></script>
</body>
</html>
